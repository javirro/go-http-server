# Local development database.
# Bring it up with: make db-up   (or: docker compose up -d)
services:
  postgres:
    image: postgres:16-alpine
    container_name: football-store-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: football_store
    ports:
      - "5656:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d football_store"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
